# Run from the repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
# ROOT_DOMAIN decides the hosts: www/learn/admin/api.<ROOT_DOMAIN> (e.g. staging.workiz.net).

x-next-build-args: &next-build-args
  NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
  NEXT_PUBLIC_LEARN_URL: ${NEXT_PUBLIC_LEARN_URL}
  NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN:-}
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@workiz.net}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.next
      args:
        <<: *next-build-args
        APP_NAME: web
    env_file: ../.env
    environment:
      PORT: 3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`www.${ROOT_DOMAIN:-localhost}`) || Host(`${ROOT_DOMAIN:-localhost}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=3000
    depends_on:
      - api
    restart: unless-stopped

  learn:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.next
      args:
        <<: *next-build-args
        APP_NAME: learn
    env_file: ../.env
    environment:
      PORT: 3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.learn.rule=Host(`learn.${ROOT_DOMAIN:-localhost}`)
      - traefik.http.routers.learn.entrypoints=websecure
      - traefik.http.routers.learn.tls.certresolver=le
      - traefik.http.services.learn.loadbalancer.server.port=3000
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.next
      args:
        <<: *next-build-args
        APP_NAME: admin
    env_file: ../.env
    environment:
      PORT: 3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`admin.${ROOT_DOMAIN:-localhost}`)
      - traefik.http.routers.admin.entrypoints=websecure
      - traefik.http.routers.admin.tls.certresolver=le
      - traefik.http.services.admin.loadbalancer.server.port=3000
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    env_file: ../.env
    environment:
      API_PORT: 4000
      REDIS_URL: redis://redis:6379
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${ROOT_DOMAIN:-localhost}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=4000
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - api
    restart: unless-stopped

volumes:
  redis_data:
