services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@workix.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.next
      args:
        APP_NAME: web
    env_file: ../.env
    environment:
      PORT: 3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`www.${ROOT_DOMAIN:-localhost}`) || Host(`${ROOT_DOMAIN:-localhost}`)
      - traefik.http.routers.web.entrypoints=web,websecure
      - traefik.http.services.web.loadbalancer.server.port=3000
    depends_on:
      - api
    restart: unless-stopped

  learn:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.next
      args:
        APP_NAME: learn
    env_file: ../.env
    environment:
      PORT: 3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.learn.rule=Host(`learn.${ROOT_DOMAIN:-localhost}`)
      - traefik.http.routers.learn.entrypoints=web,websecure
      - traefik.http.services.learn.loadbalancer.server.port=3000
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.next
      args:
        APP_NAME: admin
    env_file: ../.env
    environment:
      PORT: 3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`admin.${ROOT_DOMAIN:-localhost}`)
      - traefik.http.routers.admin.entrypoints=web,websecure
      - traefik.http.services.admin.loadbalancer.server.port=3000
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    env_file: ../.env
    environment:
      API_PORT: 4000
      REDIS_URL: redis://redis:6379
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${ROOT_DOMAIN:-localhost}`)
      - traefik.http.routers.api.entrypoints=web,websecure
      - traefik.http.services.api.loadbalancer.server.port=4000
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - api
    restart: unless-stopped

volumes:
  redis_data:
